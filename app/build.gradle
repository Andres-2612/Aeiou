plugins {
    id 'com.android.application'
}

android {
    namespace 'com.recco.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.recco.launcher'
        minSdk 25
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
